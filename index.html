<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carlo Acutis: Az eucharisztikus csodák nyomában</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    /* ITT MÓDOSÍTHATOD A HÁTTÉRKÉP NEVÉT */
   background-image: url("DSC_5670.JPG");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.container {
    width: 100%;
    max-width: 800px;

    background: rgba(255,255,255,0.6);

    padding: 25px;
    border-radius: 20px;

    text-align: center;

    box-shadow: 0 0 25px rgba(0,0,0,0.3);
}

h1 {
    margin-top: 0;
    color: #333;
}

.description {
    margin-bottom: 25px;
    color: #555;
}

.code-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
}

.input-group {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.label {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 6px;
}

.code-input {
    width: 52px;
    height: 52px;

    text-align: center;
    font-size: 28px;

    border: 2px solid #999;
    border-radius: 10px;

    outline: none;
}

.code-input:focus {
    border-color: #0078d7;
}

button {
    margin-top: 25px;

    width: 100%;
    max-width: 300px;

    padding: 15px;

    font-size: 18px;
    font-weight: bold;

    border: none;
    border-radius: 12px;

    background: #0078d7;
    color: white;

    cursor: pointer;
}

button:hover {
    background: #005fa8;
}

#message {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    min-height: 24px;
}

@media (max-width: 480px) {

    .code-input {
        width: 45px;
        height: 45px;
        font-size: 24px;
    }

    .label {
        font-size: 16px;
    }

    h1 {
        font-size: 24px;
    }

}
</style>
</head>

<body>

<div class="container">

    
    <h1>Carlo Acutis: Az eucharisztikus csodák nyomában</h1>

    <!-- ITT MÓDOSÍTHATOD A LEÍRÁST -->
    <div class="description">
        Az idő a kulcs a megoldáshoz!
    </div>

    <div class="code-container">

        <!-- ITT MÓDOSÍTHATOD A BETŰKET -->

        <div class="input-group">
            <div class="label">1</div>
            <input class="code-input" maxlength="1" inputmode="numeric">
        </div>

        <div class="input-group">
            <div class="label">2</div>
            <input class="code-input" maxlength="1" inputmode="numeric">
        </div>

        <div class="input-group">
            <div class="label">3</div>
            <input class="code-input" maxlength="1" inputmode="numeric">
        </div>

        <div class="input-group">
            <div class="label">4</div>
            <input class="code-input" maxlength="1" inputmode="numeric">
        </div>

        <div class="input-group">
            <div class="label">5</div>
            <input class="code-input" maxlength="1" inputmode="numeric">
        </div>

        <div class="input-group">
            <div class="label">6</div>
            <input class="code-input" maxlength="1" inputmode="numeric">
        </div>

        <div class="input-group">
            <div class="label">7</div>
            <input class="code-input" maxlength="1" inputmode="numeric">
        </div>

        <div class="input-group">
            <div class="label">8</div>
            <input class="code-input" maxlength="1" inputmode="numeric">
        </div>

        <div class="input-group">
            <div class="label">9</div>
            <input class="code-input" maxlength="1" inputmode="numeric">
        </div>

        <div class="input-group">
            <div class="label">10</div>
            <input class="code-input" maxlength="1" inputmode="numeric">
        </div>

        <div class="input-group">
            <div class="label">11</div>
            <input class="code-input" maxlength="1" inputmode="numeric">
        </div>

    </div>

    <button onclick="checkCode()">ELLENŐRZÉS</button>

    <div id="message"></div>

</div>

<script>

/*
==========================================
ITT ADD MEG A HELYES 11 JEGYŰ KÓDOT
==========================================
*/
const correctCode = "39317742364";

const inputs = document.querySelectorAll(".code-input");

/* Automatikus léptetés */
inputs.forEach((input, index) => {

    input.addEventListener("input", () => {

        input.value = input.value.replace(/[^0-9]/g, "");

        if (
            input.value.length === 1 &&
            index < inputs.length - 1
        ) {
            inputs[index + 1].focus();
        }

    });

    input.addEventListener("keydown", (e) => {

        if (
            e.key === "Backspace" &&
            input.value === "" &&
            index > 0
        ) {
            inputs[index - 1].focus();
        }

    });

});

/* Enter gombbal is ellenőrizhető */
document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        checkCode();
    }
});

function checkCode() {

    const message = document.getElementById("message");

    let enteredCode = "";
    let allCorrect = true;

    inputs.forEach(input => {
        enteredCode += input.value;
    });

    inputs.forEach((input, index) => {

        input.style.backgroundColor = "";
        input.style.border = "2px solid #999";

        if (input.value === "") {
            allCorrect = false;
            return;
        }

        if (input.value === correctCode[index]) {

            input.style.border = "3px solid #28a745";
            input.style.backgroundColor = "#eaf9ee";

        } else {

            input.style.border = "3px solid #dc3545";
            input.style.backgroundColor = "#fdeaea";

            allCorrect = false;
        }

    });

    if (allCorrect) {

        message.style.color = "green";

        message.innerHTML =
        "Az alábbi jelszót vidd a kapuőrnek aki ha tehetné, most kápolna: Az Eucharisztia autópálya a mennyországba";

    } else {

        message.style.color = "red";

        message.innerHTML =
        "Hibás kód, próbáld újra!";

    }
}

</script>


</body>
</html>
